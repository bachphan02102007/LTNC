name: Java CI/CD

# Kích hoạt trên tất cả các nhánh khi có push hoặc pull request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Cài đặt JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build bằng Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4. Chạy Checkstyle
      - name: Run Checkstyle
        run: mvn checkstyle:check

      # 5. Chạy JUnit test
      - name: Run Tests
        run: mvn test

      # 6. Upload artifact (tùy chọn)
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-app
          path: target/*.jar
